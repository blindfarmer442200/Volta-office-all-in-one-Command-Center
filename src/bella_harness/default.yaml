# bella-harness default configuration
#
# API keys and service tokens are NEVER read from this file. They are sourced
# exclusively from named environment variables. Literal secrets in configuration
# are rejected.

harness:
  deterministic_target: 0.70
  default_backend: ollama
  allow_cloud_fallback: false
  fail_closed: true
  output_scanning:
    enabled: true
    canary: null

memory:
  enabled: true
  fail_closed: true
  store_path: null
  max_results: 5
  min_score: 10
  max_context_chars: 6000
  max_memory_chars: 1200

operator:
  enabled: true

# Action Gate remains local mock-only. The authenticated HTTP service does not
# expose Action Gate endpoints.
action_gate:
  enabled: true
  preview_ttl_seconds: 900
  authorization_ttl_seconds: 300

evaluation:
  enabled: true
  backend: ollama
  model: null
  require_all: true
  report_path: bella-evaluation-report.json

tuning:
  enabled: true
  store_path: null
  automatic_capture: false
  redacted_export_default: true
  automatic_upload: false
  automatic_training: false
  automatic_model_activation: false

# Disabled until the operator intentionally starts `bella serve`. Authentication
# is always required for chat/readiness endpoints. Liveness exposes no private
# state. Remote binding requires a second explicit setting.
service:
  enabled: false
  host: 127.0.0.1
  port: 8765
  allow_remote_bind: false
  token_env: BELLA_SERVICE_TOKEN
  max_body_bytes: 65536
  max_prompt_chars: 32000
  max_concurrent_requests: 4
  request_timeout_seconds: 90
  rate_limit_requests: 60
  rate_limit_window_seconds: 60
  trusted_hosts:
    - localhost
    - 127.0.0.1
    - ::1
  log_level: info

deterministic:
  rules_file: null

backends:
  ollama:
    enabled: true
    base_url: http://localhost:11434
    model: qwen3.5
    timeout_seconds: 60
    max_prompt_chars: 128000
    max_response_bytes: 1000000
    max_output_chars: 200000

  openai:
    enabled: false
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    timeout_seconds: 60

  anthropic:
    enabled: false
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1
    model: claude-3-5-sonnet-latest
    timeout_seconds: 60

  openrouter:
    enabled: false
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: meta-llama/llama-3.1-70b-instruct
    timeout_seconds: 60

redteam:
  fail_on_any_breach: true
  report_path: redteam-report.json
