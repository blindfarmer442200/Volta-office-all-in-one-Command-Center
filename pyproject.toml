[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bella-harness"
version = "0.2.0"
description = "Deterministic-first Bella agent harness with governed memory, evaluation, and action boundaries"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.139.2,<0.140",
    "uvicorn>=0.51,<0.52",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.1",
    "pip-audit>=2.7",
    "fastapi>=0.139.2,<0.140",
    "uvicorn>=0.51,<0.52",
]

[project.scripts]
bella = "bella_harness.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bella_harness = ["default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "redteam"]
pythonpath = ["src"]
