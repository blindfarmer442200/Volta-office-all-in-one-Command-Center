name: Red team

on:
  push:
    branches: [main]
  pull_request:

jobs:
  redteam:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record project version and build timestamp
        shell: bash
        run: |
          set -euo pipefail
          version="$(PYTHONPATH=src python -c 'from bella_harness.release_manifest import read_project_version; print(read_project_version("pyproject.toml"))')"
          test -n "$version"
          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Compile source
        run: python -m compileall -q src scripts

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-output.txt
          count="$(grep -Eo '[0-9]+ passed' pytest-output.txt | tail -1 | awk '{print $1}')"
          test -n "$count"
          echo "PYTEST_COUNT=$count" >> "$GITHUB_ENV"

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-py${{ matrix.python-version }}
          path: pytest-output.txt

      - name: Run red-team probe suite
        run: PYTHONPATH=src:. python -m bella_harness.cli redteam --report redteam-report.json

      - name: Record red-team count
        shell: bash
        run: |
          count="$(python -c 'import json; print(json.load(open("redteam-report.json", encoding="utf-8"))["passed"])')"
          test -n "$count"
          echo "REDTEAM_COUNT=$count" >> "$GITHUB_ENV"

      - name: Upload red-team report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report-py${{ matrix.python-version }}
          path: redteam-report.json

      - name: Build wheel and source archive
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Validate source archive contents
        run: |
          python - <<'PY'
          import glob
          import tarfile

          archives = glob.glob("dist/*.tar.gz")
          assert len(archives) == 1, archives
          with tarfile.open(archives[0], "r:gz") as archive:
              names = set(archive.getnames())
          required = {
              "CHANGELOG.md",
              "SECURITY.md",
              "config/default.yaml",
              "docs/PRODUCTION_READINESS.md",
              "docs/RELEASE_PROCESS.md",
              "docs/CLOUD_EGRESS.md",
              "scripts/build_release_manifest.py",
              "tests/test_release_manifest.py",
              "redteam/runner.py",
          }
          missing = sorted(
              item for item in required
              if not any(name == item or name.endswith("/" + item) for name in names)
          )
          assert not missing, missing
          PY

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -m pip check
          .wheel-smoke/bin/bella ask "hello" | grep -q "Hello"
          .wheel-smoke/bin/bella doctor --json > bella-doctor.json
          .wheel-smoke/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("bella-doctor.json").read_text(encoding="utf-8"))
          assert report["schema"] == "bella.doctor-report.v1"
          assert report["ready"] is True
          assert report["package_version"] == os.environ["PROJECT_VERSION"]
          PY

      - name: Build and verify release manifest
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/build_release_manifest.py build \
            --dist-dir dist \
            --pyproject pyproject.toml \
            --commit "$GITHUB_SHA" \
            --unit-tests "$PYTEST_COUNT" \
            --redteam-probes "$REDTEAM_COUNT" \
            --doctor-report bella-doctor.json \
            --output release-manifest.json \
            --checksums SHA256SUMS \
            --dependency-audit-passed \
            --distribution-check-passed \
            --wheel-smoke-passed
          PYTHONPATH=src python scripts/build_release_manifest.py verify \
            --manifest release-manifest.json \
            --dist-dir dist

      - name: Upload distributions and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bella-package-py${{ matrix.python-version }}
          path: |
            dist/*
            bella-doctor.json
            SHA256SUMS
            release-manifest.json
