name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: bella-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Compatibility Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src scripts

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run deterministic red team
        run: PYTHONPATH=src:. python -m bella_harness.cli redteam --report redteam-report.json

  build-release:
    name: Build verified release
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Require a main-branch release commit
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main

      - name: Require tag and project version match
        if: github.ref_type == 'tag'
        run: |
          PYTHONPATH=src python scripts/build_release_manifest.py check-tag \
            --tag "$GITHUB_REF_NAME" \
            --pyproject pyproject.toml
          test -f "docs/releases/$GITHUB_REF_NAME.md"

      - name: Compile source
        run: python -m compileall -q src scripts

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run unit tests and record count
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-output.txt
          count="$(grep -Eo '[0-9]+ passed' pytest-output.txt | tail -1 | awk '{print $1}')"
          test -n "$count"
          echo "PYTEST_COUNT=$count" >> "$GITHUB_ENV"

      - name: Run red team and record count
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python -m bella_harness.cli redteam --report redteam-report.json
          count="$(python -c 'import json; print(json.load(open("redteam-report.json", encoding="utf-8"))["passed"])')"
          test -n "$count"
          echo "REDTEAM_COUNT=$count" >> "$GITHUB_ENV"

      - name: Build wheel and source archive
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --upgrade pip
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python -m pip check
          .release-smoke/bin/bella ask "hello" | grep -q "Hello"
          .release-smoke/bin/bella doctor --json > bella-doctor.json
          .release-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("bella-doctor.json").read_text(encoding="utf-8"))
          assert report["schema"] == "bella.doctor-report.v1"
          assert report["ready"] is True
          assert report["package_version"] == "0.2.0"
          PY

      - name: Build and verify release evidence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/build_release_manifest.py build \
            --dist-dir dist \
            --pyproject pyproject.toml \
            --commit "$GITHUB_SHA" \
            --unit-tests "$PYTEST_COUNT" \
            --redteam-probes "$REDTEAM_COUNT" \
            --doctor-report bella-doctor.json \
            --output release-manifest.json \
            --checksums SHA256SUMS \
            --dependency-audit-passed \
            --distribution-check-passed \
            --wheel-smoke-passed
          PYTHONPATH=src python scripts/build_release_manifest.py verify \
            --manifest release-manifest.json \
            --dist-dir dist

      - name: Upload verified release evidence
        uses: actions/upload-artifact@v4
        with:
          name: bella-release-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/*
            pytest-output.txt
            redteam-report.json
            bella-doctor.json
            SHA256SUMS
            release-manifest.json

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            SHA256SUMS \
            release-manifest.json \
            redteam-report.json \
            bella-doctor.json \
            --verify-tag \
            --title "Bella Harness $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
